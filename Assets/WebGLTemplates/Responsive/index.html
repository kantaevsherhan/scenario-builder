<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0E121A; }
      body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #E8ECF4; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #0E121A; outline: none; }
      #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
      #loader-title { font-size: 20px; font-weight: 600; }
      #loader-track { width: min(320px, 70vw); height: 6px; border-radius: 3px; background: #222A3A; overflow: hidden; }
      #loader-fill { width: 0; height: 100%; background: #4FA8FF; transition: width 0.2s; }
      #loader-note { font-size: 13px; color: #8A94A8; }
      #fullscreen { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); padding: 5px 12px; border: 0; border-radius: 6px;
        background: rgba(44, 54, 80, 0.85); color: #E8ECF4; font: inherit; font-size: 13px; cursor: pointer; display: none; }
      #fullscreen:hover { background: #4FA8FF; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader">
      <div id="loader-title">{{{ PRODUCT_NAME }}}</div>
      <div id="loader-track"><div id="loader-fill"></div></div>
      <div id="loader-note">Загрузка…</div>
    </div>
    <button id="fullscreen" type="button">На весь экран</button>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var fill = document.querySelector("#loader-fill");
      var loader = document.querySelector("#loader");
      var fullscreen = document.querySelector("#fullscreen");

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        fill.style.width = Math.round(progress * 100) + "%";
      }).then(function (instance) {
        loader.remove();
        fullscreen.style.display = "block";
        fullscreen.onclick = function () { instance.SetFullscreen(1); };
        canvas.focus();
      }).catch(function (message) {
        document.querySelector("#loader-note").textContent = message;
      });
    </script>
  </body>
</html>
